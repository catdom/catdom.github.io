<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- No background: the triangle sits on whatever the browser's tab strip is.
       It is drawn in the accent, which holds on a light strip and on a dark
       one alike, so this needs no colour-scheme query and no second file. -->
  <!-- Drawn inset and stroked with a round join, which rounds the three
       corners without hand-built arcs. -->
  <path d="M16 9 25 23 7 23Z" fill="#1f3fd8" stroke="#1f3fd8" stroke-width="4" stroke-linejoin="round"/>
</svg>
