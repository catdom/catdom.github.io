<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The wordmark is "jcd." and at 16px the only part of it that survives is
       the full stop. So the favicon is the accent square with that stop in it:
       one shape, one colour, legible at tab size, the same in both schemes. -->
  <rect width="32" height="32" rx="7" fill="#1f3fd8"/>
  <circle cx="16" cy="21" r="4.4" fill="#ffffff"/>
  <path d="M16 7.5v6" stroke="#ffffff" stroke-width="4.4" stroke-linecap="round"/>
</svg>
